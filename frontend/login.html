<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FraudGuard — Secure Login</title>
  <meta name="description" content="FraudGuard Detection System — Secure institutional login portal." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --navy: #1E3A5F;
      --navy-dark: #152d4a;
      --navy-light: #2a4f80;
      --accent: #3B82F6;
      --accent-glow: rgba(59, 130, 246, .35);
      --white: #FFF;
      --muted: rgba(255, 255, 255, .55);
      --border: rgba(255, 255, 255, .12);
      --error: #EF4444;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 20% 50%, rgba(59, 130, 246, .08) 0%, transparent 60%),
        linear-gradient(135deg, #0a1628 0%, #1a2d4a 40%, #0f2040 70%, #0a1628 100%);
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(59, 130, 246, .04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, .04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: floatOrb 12s ease-in-out infinite
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      top: -100px;
      left: -100px;
      background: rgba(30, 58, 95, .5)
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      bottom: -80px;
      right: -80px;
      background: rgba(59, 130, 246, .12);
      animation-delay: 4s
    }

    @keyframes floatOrb {

      0%,
      100% {
        transform: translate(0, 0)
      }

      50% {
        transform: translate(20px, -30px)
      }
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: fadeUp .7s cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(32px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .brand-header {
      text-align: center
    }

    .shield-wrap {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--navy-light), var(--navy-dark));
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      position: relative;
      box-shadow: 0 0 32px rgba(59, 130, 246, .2), 0 8px 32px rgba(0, 0, 0, .4);
    }

    .shield-wrap svg {
      color: var(--accent);
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, .5))
    }

    .pulse-ring {
      position: absolute;
      inset: -4px;
      border-radius: 24px;
      border: 1px solid rgba(59, 130, 246, .3);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0;
        transform: scale(1)
      }

      50% {
        opacity: 1;
        transform: scale(1.08)
      }
    }

    .brand-name {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -.5px;
      color: var(--white);
      line-height: 1
    }

    .brand-name span {
      color: var(--accent)
    }

    .brand-sub {
      margin-top: 6px;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase
    }

    .login-card {
      width: 100%;
      background: rgba(255, 255, 255, .04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 36px 32px;
      box-shadow: 0 32px 64px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 4px
    }

    .card-sub {
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 28px
    }

    .form-group {
      margin-bottom: 18px
    }

    .form-group label {
      display: block;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .6);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: rgba(255, 255, 255, .35);
      pointer-events: none;
      display: flex;
      align-items: center
    }

    .input-wrap input {
      width: 100%;
      padding: 13px 14px 13px 44px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 10px;
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: .9rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .input-wrap input::placeholder {
      color: rgba(255, 255, 255, .25)
    }

    .input-wrap input:focus {
      border-color: var(--accent);
      background: rgba(59, 130, 246, .06);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .toggle-pw {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255, 255, 255, .35);
      display: flex;
      align-items: center;
      padding: 4px;
      transition: color .2s;
    }

    .toggle-pw:hover {
      color: rgba(255, 255, 255, .7)
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: .82rem;
      color: rgba(255, 255, 255, .6);
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid rgba(255, 255, 255, .25);
      border-radius: 4px;
      background: rgba(255, 255, 255, .05);
      cursor: pointer;
      transition: all .2s;
      flex-shrink: 0;
      position: relative;
    }

    .checkbox-label input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent)
    }

    .checkbox-label input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .btn-signin {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--navy-light), var(--navy));
      border: 1px solid rgba(59, 130, 246, .3);
      border-radius: 10px;
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .15s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(30, 58, 95, .5);
    }

    .btn-signin:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(30, 58, 95, .6)
    }

    .btn-signin:active {
      transform: translateY(0)
    }

    .btn-signin:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }

    .btn-signin.loading .btn-text {
      display: none
    }

    .btn-signin.loading .spinner {
      display: block
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: .8rem;
      color: rgba(255, 255, 255, .45);
      text-decoration: none;
      transition: color .2s;
    }

    .forgot-link:hover {
      color: var(--accent)
    }

    .error-msg {
      background: rgba(239, 68, 68, .1);
      border: 1px solid rgba(239, 68, 68, .3);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: .82rem;
      color: #fca5a5;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .error-msg.hidden {
      display: none
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border)
    }

    .divider span {
      font-size: .7rem;
      color: var(--muted);
      white-space: nowrap;
      letter-spacing: 1px
    }

    .sec-badges {
      display: flex;
      justify-content: center;
      gap: 20px
    }

    .sec-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: .68rem;
      color: rgba(255, 255, 255, .3)
    }

    .login-footer {
      text-align: center;
      font-size: .72rem;
      color: rgba(255, 255, 255, .25);
      letter-spacing: .5px
    }

    @media(max-width:480px) {
      .login-card {
        padding: 28px 22px 24px
      }
    }
  </style>
</head>

<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-wrapper">
    <div class="brand-header">
      <div class="shield-wrap">
        <div class="pulse-ring"></div>
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
      </div>
      <div class="brand-name">Fraud<span>Guard</span></div>
      <div class="brand-sub">Institutional Vigilance</div>
    </div>

    <div class="login-card">
      <div class="card-title">Secure Access Portal</div>
      <div class="card-sub">Sign in with your institutional credentials</div>

      <div class="error-msg hidden" id="error-msg" role="alert">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span id="error-text"></span>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
              </svg>
            </span>
            <input type="email" id="login-email" name="email" placeholder="you@institution.com" autocomplete="email"
              required />
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input type="password" id="login-password" name="password" placeholder="••••••••••••"
              autocomplete="current-password" required />
            <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" />
            Remember Me
          </label>
          <a href="#" class="forgot-link" style="margin-top:0" id="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-signin" id="signin-btn">
          <span class="btn-text">SIGN IN</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div class="divider"><span>SYSTEM INTEGRITY VERIFIED</span></div>
      <div class="sec-badges">
        <span class="sec-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          TLS 1.3
        </span>
        <span class="sec-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          JWT Secured
        </span>
        <span class="sec-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          Session Monitored
        </span>
      </div>
    </div>

    <div class="login-footer">FraudGuard Detection System v1.0</div>
  </div>

  <script>
    const API_BASE = window.location.origin

    // ── Password toggle
    const pwInput = document.getElementById('login-password');
    const togglePw = document.getElementById('toggle-pw');
    const eyeIcon = document.getElementById('eye-icon');
    togglePw.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      eyeIcon.innerHTML = show
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    // ── Error helpers
    const errorBox = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');
    const showError = msg => { errorText.textContent = msg; errorBox.classList.remove('hidden'); };
    const hideError = () => { errorBox.classList.add('hidden'); };

    // ── Forgot password
    document.getElementById('forgot-link').addEventListener('click', e => {
      e.preventDefault();
      showError('Please contact your system administrator to reset your password.');
    });

    // ── Form submit
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      hideError();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('remember-me').checked;

      if (!email || !password) { showError('Please enter both email and password.'); return; }

      const btn = document.getElementById('signin-btn');
      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.token) {
          const store = remember ? localStorage : sessionStorage;
          store.setItem('fg_token', data.token);
          store.setItem('fg_user', JSON.stringify(data.user));

          btn.classList.remove('loading');
          btn.style.background = 'linear-gradient(135deg,#059669,#10B981)';
          btn.querySelector('.btn-text').style.display = 'block';
          btn.querySelector('.btn-text').textContent = '✓ ACCESS GRANTED';

          setTimeout(() => { window.location.href = '/dashboard'; }, 800);
        } else {
          showError(data.error || 'Invalid credentials. Please try again.');
          btn.disabled = false;
          btn.classList.remove('loading');
        }
      } catch {
        showError('Unable to reach the server. Please check your connection.');
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    });

    // ── Skip login if already authenticated
    (function checkAuth() {
      if (localStorage.getItem('fg_token') || sessionStorage.getItem('fg_token')) {
        window.location.href = '/dashboard';
      }
    })();
  </script>
</body>

</html>
